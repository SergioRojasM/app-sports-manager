<h2>Te invitaron a GRIT Arena</h2>

<p>Una organización te invitó a unirte a su equipo en GRIT Arena.</p>

<p>Para aceptar, crea tu contraseña con el siguiente enlace:</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&redirect_to={{ .RedirectTo }}">
    Aceptar invitación
  </a>
</p>

<p>Si no esperabas esta invitación, puedes ignorar este correo.</p>
