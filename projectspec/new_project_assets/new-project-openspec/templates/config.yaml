schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Application: {{APP_NAME}} — {{APP_DESCRIPTION}}
  Tech stack: use described in the projectspec/01-project-tech-stack.md
  Specification file: The specification file located in projectspec/03-project-structure.md is a markdown file that describes the application, its architecture, and the tasks to be implemented. It includes sections such as "Directory Structure", "Hexagonal Architecture Layers", "Feature Slice Convention", "Architecture Rules", and "Code Style Rules". The specification file is the source of truth for all development work.
  UI design guide: DESIGN.md at the project root describes the design tokens, page skeleton and component kit.
  User stories: located in projectspec/userstory/ with the name format us{NNNN}-{short-description}.md

# Per-artifact rules
rules:
  proposal:
    - always use the User story input for creating a proposal, if you don't have it, ask for it first
    - Always use following methodology when creating a proposal (page -> component -> hook -> service -> types)
    - To create a page or component, always ask for the design first (can be a sketch, pen or html).
    - Always read DESIGN.md before proposing any page or component; use only its tokens and component kit
    - Always refer to the specification file projectspec/03-project-structure.md for task details and requirements
    - Always include a "Non-goals" section
    - Always include files to be modified or created
    - Always include a step-by-step implementation plan
  design:
    - Always use following methodology when creating a design (page -> component -> hook -> service -> types)
    - Always refer to the specification file projectspec/03-project-structure.md for task details and requirements
    - Include architecture diagrams if applicable
    - Always read DESIGN.md before designing any page or component; use only its tokens and component kit
    - never push the migration to remote supabase server, only local
  tasks:
    - Always use following methodology when creating a task (page -> component -> hook -> service -> types)
    - Always the first task must be to create a new branch with name format feat/description or fix/description
    - Second task must be validate that the working branch is not main, master, or develop
    - Always refer to the specification file projectspec/03-project-structure.md for task details and requirements
    - Always create an update documentation task on projectspec/03-project-structure.md if the implementation affects the documentation
    - always create a task with the creation of a commit message and pull request description for the implementation
    - always check type, lint, and test before creating a commit message and pull request description, but never build
